# ─── SGM — BSA Consultora ─────────────────────────────────────────────────────
# Nginx reverse proxy con redirección HTTP→HTTPS y headers de seguridad.
#
# Para producción:
#   1. Colocar cert.pem y key.pem en infra/certs/
#   2. Cambiar "server_name localhost" por tu dominio real
#   3. Para desarrollo sin certs, comentar el bloque HTTPS y descomentar el HTTP

# ─── HTTP: redirige todo a HTTPS ──────────────────────────────────────────────
server {
  listen 80;
  server_name _;

  # Solo acepta ACME challenge (Let's Encrypt) en texto plano
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Todo lo demás: redirigir a HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# ─── HTTPS ────────────────────────────────────────────────────────────────────
server {
  listen 443 ssl http2;
  server_name localhost;  # Cambiar por tu dominio en producción

  # Certificados TLS (colocar en infra/certs/)
  ssl_certificate     /etc/nginx/certs/cert.pem;
  ssl_certificate_key /etc/nginx/certs/key.pem;

  # Protocolos y cifrados seguros
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache   shared:SSL:10m;

  # ─── Headers de seguridad ─────────────────────────────────────────────
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Frame-Options           "SAMEORIGIN" always;
  add_header X-Content-Type-Options    "nosniff" always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
  add_header X-XSS-Protection          "1; mode=block" always;
  add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

  # ─── Tamaño máximo de payload (fotos, adjuntos) ───────────────────────
  client_max_body_size 20M;

  # ─── Proxy al API FastAPI ─────────────────────────────────────────────
  location /api/ {
    proxy_pass         http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $http_connection;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # ─── Uploads estáticos ────────────────────────────────────────────────
  location /uploads/ {
    proxy_pass http://api:8000/uploads/;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # ─── Health check (sin log) ───────────────────────────────────────────
  location /health {
    proxy_pass http://api:8000/health;
    access_log off;
  }

  # ─── Página de error personalizada ───────────────────────────────────
  error_page 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
    internal;
  }
}

